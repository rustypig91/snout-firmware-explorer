[workspace]
members = ["crates/snout-core", "crates/snout-cli", "crates/snout"]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
snout-core = { path = "crates/snout-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
