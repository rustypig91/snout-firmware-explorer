[workspace]
members = ["crates/firmware-analysis-core", "crates/firmware-cli", "crates/firmware-gui"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
firmware-analysis-core = { path = "crates/firmware-analysis-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
